name: Deploy analyzer test site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare test site from analyzer branch
        run: |
          set -e
          mkdir -p dist
          curl -fsSL https://raw.githubusercontent.com/markebora/worship-chords/song-analyzer-v2/index.html -o dist/index.html
          curl -fsSL https://raw.githubusercontent.com/markebora/worship-chords/song-analyzer-v2/song-analyzer.js -o dist/song-analyzer.js
          test -s dist/index.html
          test -s dist/song-analyzer.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
